name: CuidaBot CI-CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build e testes automatizados
        run: ./mvnw clean verify

      - name: Build da imagem Docker
        run: docker build -t cuidabot-esg-api:${{ github.sha }} .

  deploy-staging:
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Validar configuração de staging
        run: docker compose config
      - name: Deploy de staging
        run: |
          echo "STAGING: pipeline validado para deploy automatizado."
          echo "Em ambiente real, este job executa docker compose up -d oracle-db staging no servidor de staging."

  deploy-production:
    needs: deploy-staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Validar configuração de produção
        run: docker compose config
      - name: Deploy de produção
        run: |
          echo "PRODUCTION: pipeline validado para deploy automatizado."
          echo "Em ambiente real, este job executa docker compose up -d oracle-db production no servidor de produção."
